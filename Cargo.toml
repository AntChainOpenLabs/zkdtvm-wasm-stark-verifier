[package]
name = "dt-wasm-verifier"
version = "0.8.0"
edition = "2021"
description = "WASM bindings for zkdtvm compressed proof verification (zkdtvm-stark-verifier)"
license = "Apache-2.0"
repository = "https://github.com/AntChainOpenLabs/zkdtvm-wasm-stark-verifier"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Public q131/full-opening release; Cargo.lock pins the tag's resolved commit.
zkdtvm-stark-verifier = { git = "https://github.com/AntChainOpenLabs/zkdtvm-stark-verifier.git", tag = "v0.8.0", default-features = false }
wasm-bindgen = "0.2.100"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"

# Force `getrandom` to enable the `js` feature on wasm32. Without this, transitive
# dependencies pull in `getrandom` without the web-compatible backend and the build
# fails on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Speed over wasm size: faster in-browser verify (often noticeably vs opt-level "s" + -Oz).
[profile.release]
opt-level = 3
codegen-units = 1
lto = true

# Rust O3 + LTO is the optimization boundary; build without a Binaryen post-pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
